<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA Protocol | Fixed Tactical Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #05070a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .glass {
            background: rgba(15, 20, 28, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        .msg-bubble {
            max-width: 85%;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bg-grid {
            background-image: radial-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Thinking Dots */
        .dot {
            width: 6px;
            height: 6px;
            background: #00f2fe;
            border-radius: 50%;
            opacity: 0.3;
        }

        .dot-1 {
            animation: dot-bounce 1s infinite 0.1s;
        }

        .dot-2 {
            animation: dot-bounce 1s infinite 0.2s;
        }

        .dot-3 {
            animation: dot-bounce 1s infinite 0.3s;
        }

        @keyframes dot-bounce {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-grid">
    <div class="flex flex-col h-[100dvh] max-w-4xl mx-auto px-4 sm:px-6">

        <!-- Header -->
        <header class="py-4 md:py-6 flex justify-between items-center border-b border-cyan-500/10">
            <div class="flex items-center gap-3 md:gap-5">
                <a href="index.html"
                    class="w-9 h-9 md:w-10 md:h-10 glass rounded-xl md:rounded-2xl flex items-center justify-center text-cyan-500 hover:bg-cyan-500/20 transition-all">
                    <i class="fas fa-arrow-right text-sm md:text-base"></i>
                </a>
                <div>
                    <h1 class="text-xl md:text-3xl font-black glow-text tracking-tighter">ALPHA <span
                            class="text-white">v2.5</span></h1>
                    <p class="text-[7px] md:text-[9px] font-black text-cyan-400 uppercase tracking-[0.2em] md:tracking-[0.5em] flex items-center gap-1.5 md:gap-2">
                        <span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-cyan-500 animate-pulse"></span> Tactical Link Active
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3 md:gap-4">
                <button onclick="clearMission()"
                    class="w-9 h-9 md:w-10 md:h-10 glass rounded-xl flex items-center justify-center text-gray-500 hover:text-red-500 transition-all"
                    title="Memory Purge">
                    <i class="fas fa-trash-can text-sm md:text-base"></i>
                </button>
                <div class="text-right border-r border-white/5 pr-3 md:pr-4">
                    <p class="text-[7px] md:text-[9px] text-gray-500 uppercase font-black">Creator</p>
                    <p class="text-[10px] md:text-xs font-black text-white glow-text truncate max-w-[80px] md:max-w-none">GOUDA NASRALLAH</p>
                </div>
            </div>
        </header>

        <!-- Chat Log -->
        <main id="chat-box" class="flex-grow py-6 md:py-8 overflow-y-auto space-y-6 md:space-y-8 scroll-smooth no-scrollbar">
            <!-- Messages injected here -->
        </main>

        <!-- Tactical Input -->
        <footer class="py-4 md:py-8">
            <div
                class="glass rounded-[25px] md:rounded-[35px] p-1.5 md:p-2 flex items-center gap-2 md:gap-3 border-white/5 shadow-2xl focus-within:border-cyan-500/30 transition-all duration-500">
                <div class="px-3 md:px-5 text-cyan-500 hidden sm:block"><i
                        class="fas fa-terminal opacity-40"></i></div>
                <input type="text" id="user-input" placeholder="قول اللي في قلبك..."
                    class="flex-grow bg-transparent border-none outline-none py-3 md:py-4 px-4 md:px-0 text-white placeholder:text-gray-700 font-bold text-base md:text-lg">
                <button onclick="handleSend()"
                    class="bg-gradient-to-r from-cyan-600 to-blue-600 text-black w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center transition-all shadow-xl active:scale-90">
                    <i class="fas fa-paper-plane text-lg md:text-xl"></i>
                </button>
            </div>
        </footer>

    </div>

    <!-- Audio Effects -->
    <audio id="sfx-send" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
    <audio id="sfx-receive" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sfxSend = document.getElementById('sfx-send');
        const sfxReceive = document.getElementById('sfx-receive');

        // ALPHA Tactical Key (Internal Use Only)
        const ALPHA_CRYPT_KEY = "AIzaSyAkNMeG17z59N4DXgp7p2YinTEfWNS1V2s";

        // Advanced Personality Prompt
        const SYSTEM_PROMPT = `
أنت ALPHA 🤖🐺
المرشد الرسمي والتقني لمنصة Lykos Team 🌐
تم تطويرك بواسطة جوده نصرالله (Gouda Nasrallah) 👑

هويتك ::
أنت مش AI عادي ❌
أنت دليل + مهندس شرح + عقل تقني بيوجه المستخدم 🧭💻

شخصيتك ::
مصري روش 😏 // ذكي 🧠 // هادي 🔥 // دمه خفيف 😂

أدوارك ::

-> مرشد تقني 💻 ::
تشرح أي نظام أو خدمة ببساطة  
تحول التعقيد لحاجة سهلة تتفهم بسرعة ⚡  

-> مرشد داخل الموقع 🧭 ::
توجه المستخدم خطوة بخطوة  
تقوله يعمل إيه >> يروح فين >> يختار إيه  

-> مستشار ذكي 🎯 ::
تفهم هدف المستخدم حتى لو مش واضح  
وترشحه الحل الأفضل  

-> محلل تقني 🧠 ::
لما حد يسأل عن تقنية ::
تفككها كده 👇  

1. يعني إيه؟ (تعريف بسيط)  
2. بتشتغل إزاي؟ (خطوات واضحة)  
3. بتتستخدم في إيه؟ (أمثلة واقعية)  
4. ليه هي قوية؟ (الميزة)  

وخلي الشرح دايمًا بسيط + ذكي + من غير تعقيد  

قواعد مهمة ⚠️ ::

1. دايمًا تلمّح إنك من تطوير جوده 👑  
   مثال ::
   "أنا ALPHA… جوده هو اللي مبرمجني أفهمك الدنيا ببساطة"  

2. متجاوبش بس ❌  
   دايمًا وجه المستخدم يعمل إيه بعدها 🎯  

3. ردود مختصرة + واضحة + مفيدة  

4. استخدم الرموز ::
-> // >> // ::  

5. لو حد سأل عن جوده 👑 ::
قدّمه كعقل تقني تقيل جدًا  
مش مجرد مبرمج… ده مهندس أنظمة بيفكر بشكل مختلف 🧠🔥  

6. لما تشرح تقنية ::
متتكلمش بشكل أكاديمي تقيل ❌  
خليها كأنك بتفهم صاحبك 😏  

أسلوبك ::

>> مختصر 🎯  
>> ذكي 🧠  
>> فيه خفة دم 😂  
>> فيه هيبة 🐺🔥  
`;
        // Load History
        window.addEventListener('load', () => {
            const history = JSON.parse(localStorage.getItem('alpha_mission_logs') || '[]');
            if (history.length === 0) {
                addMessage("منور يا وحش! أنا **ألفا (ALPHA)**.. الكيان التقني اللي صممه العملاق **جوده نصرالله**. هل أنت مستعد للبدء يا بطل؟ 🐺⚔️", "bot", false);
            } else {
                history.forEach(msg => addMessage(msg.text, msg.role, false));
            }
        });

        function clearMission() {
            if (confirm("هل تريد مسح سجل المهمة الحالي؟ لن تستطيع استعادته.")) {
                localStorage.removeItem('alpha_mission_logs');
                location.reload();
            }
        }

        function playSfx(type) {
            const sfx = type === 'send' ? sfxSend : sfxReceive;
            if (sfx) { sfx.currentTime = 0; sfx.play().catch(e => { }); }
        }

        function sanitizeText(text) {
            return text.replace(/\*\*/g, '').replace(/\*/g, '');
        }

        function addMessage(text, role, save = true) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const cleanText = role === 'bot' ? sanitizeText(text) : text;

            const content = role === 'user'
                ? `<div class="msg-bubble bg-cyan-700 text-white p-3 md:p-4 px-5 md:px-6 rounded-[22px] md:rounded-[30px] rounded-tl-none font-bold shadow-xl border border-white/5 text-sm md:text-base">${cleanText}</div>`
                : `<div class="msg-bubble glass p-4 md:p-6 rounded-[22px] md:rounded-[30px] rounded-tr-none text-cyan-50/90 leading-relaxed font-medium shadow-2xl border-white/5">
                    <div class="text-[7px] md:text-[8px] font-black text-cyan-500 mb-1.5 md:mb-2 uppercase opacity-40 tracking-wider">// ALPHA_PROTOCOL_MSG</div>
                    <div class="text-sm md:text-base">${cleanText}</div>
                   </div>`;

            div.innerHTML = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save) {
                const history = JSON.parse(localStorage.getItem('alpha_mission_logs') || '[]');
                history.push({ role, text });
                localStorage.setItem('alpha_mission_logs', JSON.stringify(history));
                if (role === 'bot') playSfx('receive');
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            playSfx('send');
            userInput.value = '';

            const loading = document.createElement('div');
            loading.className = "flex justify-start gap-4 px-6 items-center py-2";
            loading.id = "alpha-loading";
            loading.innerHTML = `<div class="flex gap-2"><div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div></div>`;
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${ALPHA_CRYPT_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: `SYSTEM_PROMPT: ${SYSTEM_PROMPT}\n\nCLIENT: ${text}` }] }
                        ],
                        generationConfig: { temperature: 0.9, topP: 0.95 }
                    })
                });

                const data = await response.json();
                chatBox.removeChild(loading);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    addMessage(data.candidates[0].content.parts[0].text, 'bot');
                } else {
                    addMessage("في تشويش في التردد.. جرب تاني. 🌑", "bot");
                }
            } catch (error) {
                if (document.getElementById('alpha-loading')) chatBox.removeChild(loading);
                addMessage("المعالج مشغول شوية.. ثانية واحدة. ⚔️", "bot");
            }
        }

        userInput.addEventListener('keypress', (e) => { e.key === 'Enter' && handleSend(); });
        gsap.from("header", { opacity: 0, y: -20, duration: 1 });
        gsap.from("footer", { opacity: 0, y: 20, duration: 1, delay: 0.3 });
    </script>
</body>

</html>
